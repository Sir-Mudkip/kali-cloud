name: build-image

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - master
  schedule:
    - cron: '0 0 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kali-cloud
  IMAGE_TAG: latest

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Set image reference
        id: meta
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${{ env.REGISTRY }}/${OWNER}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          podman info
          podman build -t ${{ steps.meta.outputs.image }} .

      - name: Rechunk image
        run: |
          set -o pipefail
          IMG="${{ steps.meta.outputs.image }}"
          # chunkah needs the original image config (labels/entrypoint/etc.) fed back in,
          # otherwise it produces a rechunked image with an empty config.
          CHUNKAH_CONFIG_STR=$(podman inspect "$IMG" | jq '.[0].Config')
          export CHUNKAH_CONFIG_STR
          mkdir -p /tmp/chunked
          # --output oci: writes the OCI layout straight to disk, and --compressed
          # emits registry-native gzip blobs so the push is a pass-through. Together
          # these avoid the old "| podman load" round trip, which spooled the whole
          # uncompressed image through /var/tmp and then imported a third copy into
          # containers-storage. See docs/ci-cd.md.
          # dst= (not dest=): podman 4.9.x on the runner rejects the newer dest alias.
          podman run --rm \
            --mount=type=image,src="$IMG",dst=/chunkah \
            -v /tmp/chunked:/out:z \
            -e CHUNKAH_CONFIG_STR quay.io/coreos/chunkah:v0.6.0 build \
              --max-layers 120 --compressed --output oci:/out/image

      - name: Push image
        id: push
        if: github.event_name != 'pull_request'
        run: |
          # Pushes straight from the rechunked OCI layout. The rechunked image is
          # NOT in containers-storage, so a `podman push` here would publish the
          # pre-chunk build instead.
          skopeo copy --authfile="$HOME/.docker/config.json" \
            --digestfile=/tmp/digest \
            oci:/tmp/chunked/image \
            docker://${{ steps.meta.outputs.image }}
          image="${{ steps.meta.outputs.image }}"
          echo "ref=${image%:*}@$(cat /tmp/digest)" >> $GITHUB_OUTPUT

      - name: Sign image (keyless)
        if: github.event_name != 'pull_request'
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --yes ${{ steps.push.outputs.ref }}
